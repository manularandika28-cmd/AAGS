services:
  mysql:
    image: mysql:8.4
    container_name: aags-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aags
      MYSQL_USER: aags
      MYSQL_PASSWORD: aags
    ports:
      - "3307:3306"
    volumes:
      - aags_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
volumes:
  aags_mysql:
